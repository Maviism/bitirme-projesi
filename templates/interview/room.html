{% extends 'base.html' %}

{% block title %}Interview Room: {{ room_name }}{% endblock %}

{% block content %}
<div class="container">
    <h1>Interview Room: {{ room_name }}</h1>
    <div id="interview-area">
        <!-- Interview room content will go here -->
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Welcome to your interview room</h5>
                <p class="card-text">This is where your interview session will take place.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
