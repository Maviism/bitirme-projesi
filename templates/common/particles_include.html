{% load static %}
<style>
#particles-js {
  position: fixed;
  width: 100vw;
  height: 100vh;
  top: 0;
  left: 0;
  z-index: 0;
  pointer-events: none;
}
#particles-js canvas {
  position: absolute;
  width: 100vw;
  height: 100vh;
  top: 0;
  left: 0;
  z-index: 0;
}
</style>
<div id="particles-js"></div>
{% block extra_js_particles %}
<script src="{% static 'js/particles.js/particles.min.js' %}"></script>
<script>
  function setParticlesHeight() {
    var particlesDiv = document.getElementById('particles-js');
    if (particlesDiv) {
      particlesDiv.style.height = window.innerHeight + 'px';
    }
  }
  document.addEventListener("DOMContentLoaded", function() {
    setParticlesHeight();
    window.addEventListener('resize', setParticlesHeight);
    try {
      particlesJS('particles-js', {
        "particles": {
          "number": { "value": 100, "density": { "enable": true, "value_area": 800 } },
          "color": { "value": "#3498db" },
          "shape": { "type": "circle", "stroke": { "width": 0, "color": "#000000" }, "polygon": { "nb_sides": 5 } },
          "opacity": { "value": 0.5, "random": false, "anim": { "enable": false, "speed": 0.5, "opacity_min": 0.1, "sync": false } },
          "size": { "value": 3, "random": true, "anim": { "enable": false, "speed": 40, "size_min": 0.1, "sync": false } },
          "line_linked": { "enable": true, "distance": 150, "color": "#3498db", "opacity": 0.4, "width": 1 },
          "move": { "enable": true, "speed": 2, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false, "attract": { "enable": false, "rotateX": 600, "rotateY": 1200 } }
        },
        "interactivity": {
          "detect_on": "window",
          "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" }, "resize": true },
          "modes": {
            "grab": { "distance": 140, "line_linked": { "opacity": 1 } },
            "bubble": { "distance": 400, "size": 40, "duration": 2, "opacity": 8, "speed": 3 },
            "repulse": { "distance": 200, "duration": 0.4 },
            "push": { "particles_nb": 4 },
            "remove": { "particles_nb": 2 }
          }
        },
        "retina_detect": true
      });
      console.log("Particles initialized successfully");
    } catch (e) {
      console.error("Error initializing particles: ", e);
    }
  });
</script>
{% endblock %}
